[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hm310t"
version = "0.1.3"
description = "Control a Hanmatek HM310T bench power supply over Modbus RTU"
readme = "README.md"
license = "MIT"
authors = [{ name = "Joey Marino", email = "joey.da3rd@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pymodbus>=3.2.2,<3.10",
    "pyserial>=3.5",
]
keywords = [
    "hm310t",
    "hanmatek",
    "power-supply",
    "bench-power-supply",
    "modbus",
    "modbus-rtu",
    "psu",
    "instrument-control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/joeyda3rd/hm310t"
Repository = "https://github.com/joeyda3rd/hm310t"
Issues = "https://github.com/joeyda3rd/hm310t/issues"
Changelog = "https://github.com/joeyda3rd/hm310t/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hm310t = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = ["mutants"]
markers = [
    "hardware: needs a real HM310T attached (default port /dev/ttyUSB0, override with PSU_TEST_PORT)",
    "requires_load: needs a real HM310T plus a physical load wired to the output terminals; opt in with PSU_LOAD_ATTACHED=1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.mutmut]
source_paths = ["src/hm310t"]
only_mutate = ["src/hm310t/client.py", "src/hm310t/transport.py"]
pytest_add_cli_args = ["-m", "not hardware and not requires_load"]
pytest_add_cli_args_test_selection = ["tests/test_client.py", "tests/test_transport.py"]
timeout_multiplier = 10.0
timeout_constant = 2.0

[[tool.mypy.overrides]]
module = "pymodbus.*"
ignore_missing_imports = true
