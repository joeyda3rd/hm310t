name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling and the package
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy build pytest
          pip install .

      - name: Lint
        run: ruff check src tests examples tools

      - name: Format check
        run: ruff format --check src tests examples tools

      - name: Type check
        run: mypy src

      - name: Build
        run: python -m build

      - name: Verify py.typed ships in the wheel
        run: |
          python -c "import glob, zipfile; w = glob.glob('dist/*.whl')[0]; assert 'hm310t/py.typed' in zipfile.ZipFile(w).namelist(), 'py.typed missing from wheel'"

      - name: Run hardware-free tests
        run: pytest -m "not hardware and not requires_load" -v
